[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pierre"
version = "0.1.0"
description = "The evaluation layer of a startup-to-investor matching system: a report fact-checker with calibration, threshold calibration, and a bring-your-own-data ranker."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "google-genai==2.34.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["pierre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
