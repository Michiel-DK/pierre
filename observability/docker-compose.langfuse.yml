# Langfuse self-hosted, the local trace dashboard for the showcase agent (docs/observability/langfuse.md).
#
# pierre has no users. The traffic this dashboard shows is a small scheduled canary of held-out cases: the telemetry
# is real, the traffic is scheduled.
#
# Derived from the upstream compose file, langfuse/langfuse `main` at ab7d58a3e670 (fetched 16 Nov 2026), with these
# changes:
#   - Every image tag is pinned. minio only publishes `latest`, so it is pinned by its index digest.
#   - Only langfuse-web is published, and only on 127.0.0.1. The other services talk over the compose network.
#   - langfuse-ai-gateway (a beta LLM proxy, unconfigured by default) is left out.
#   - Product telemetry is off.
#   - No secret has a default (`${VAR:?}`). Every one comes from the git-ignored env file that `make langfuse-up` generates
#     (scripts/observability/langfuse_stack.sh). Without that file, compose refuses to start.
#
# Start and stop it with `make langfuse-up` / `make langfuse-down`; down also removes the volumes.

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
  DATABASE_URL: ${DATABASE_URL:?}  # postgres on the compose network; the generated env file holds the full URL
  SALT: ${SALT:?}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?}
  REDIS_TLS_ENABLED: "false"

x-depends: &depends
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.80.0
    restart: unless-stopped
    depends_on: *depends
    environment: *langfuse-env

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.80.0
    restart: unless-stopped
    depends_on: *depends
    ports:
      - 127.0.0.1:${LANGFUSE_PORT:-3000}:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      # Headless initialization: the organization, project, API keys and a user, all created at first start.
      LANGFUSE_INIT_ORG_ID: pierre-showcase
      LANGFUSE_INIT_ORG_NAME: pierre showcase
      LANGFUSE_INIT_PROJECT_ID: pierre-firm-agent
      LANGFUSE_INIT_PROJECT_NAME: pierre-firm-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?}
      LANGFUSE_INIT_USER_NAME: canary
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio@sha256:1ec745a06a986762f89e68e855fc189f403941eff8c0a5f94767e92c8e39d3f5
    restart: unless-stopped
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/library/redis:7.4.12
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH:?}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/library/postgres:17.12
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
